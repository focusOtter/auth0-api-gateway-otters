name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH0_DOMAIN: otters.auth0.com
      AUTH0_AUDIENCE: https://otters.example.com
      AUTH0_CLIENT_ID: ci-client
      AUTH0_CLIENT_SECRET: ci-placeholder-not-a-secret
      AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_BASE_URL: http://localhost:3000
      AUTH0_SCOPE: openid profile email feed:otters
      NEXT_PUBLIC_API_URL: https://example.execute-api.us-east-1.amazonaws.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx cdk synth
        working-directory: infra
      - run: npm run build -w web
