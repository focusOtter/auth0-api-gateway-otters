<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">Otter Ops: from sign-in to snack time</title>
<desc id="architecture-desc">The Next.js browser signs in with Auth0, obtains an access token for https://otters.api, and fetches API Gateway directly. CORS allows the web origin. Facts bypass JWT authorization. Roster needs a verified JWT; snacks additionally require feed:otters. Invalid credentials return 401; missing scope returns 403, without invoking Lambda.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --paper:#f8f5ec;--ink:#183e36;--muted:#53665c;--accent:#d67742 }
      #architecture-root { color: var(--ink); font-family: Arial,Helvetica,sans-serif; }
      #architecture-root .diagram-container { width:100%;overflow-x:auto }
      #architecture-root .diagram-container>svg { width:100%;min-width:1280px;display:block }
      #architecture-root text { fill:#183e36;font-family:Arial,Helvetica,sans-serif }
      #architecture-root .title { font-family:Georgia,serif;font-size:40px }
      #architecture-root .name { font-size:20px;font-weight:600 }
      #architecture-root .body { font-size:16px }
      #architecture-root .tech { font-family:monospace;font-size:13px }
      #architecture-root .edge-label { font-family:monospace;font-size:11px;letter-spacing:.5px;fill:#265b47 }
      #architecture-root .edge { fill:none;stroke:#265b47;stroke-width:2;marker-end:url(#architecture-arrow) }
      #architecture-root .return { stroke-dasharray:5 4 }
      #architecture-root .node { fill:#fffdf5;stroke:#d9ddcc;stroke-width:1.5 }
      @media print {
#architecture-root .diagram-container { overflow-x:visible }
      #architecture-root .diagram-container>svg { min-width:0 }
}</style><marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#265b47" /></marker></defs>
<rect width="1280" height="1000" fill="#f8f5ec" />
<text x="48" y="44" class="eyebrow">OTTER OPS / ARCHITECTURE / 01</text>
<text x="48" y="96" class="title">From sign-in to snack time.</text>
<text x="1232" y="92" text-anchor="end" class="tech">Auth0 + AWS API Gateway + CDK</text>

<rect x="392" y="224" width="400" height="496" rx="8" fill="#183e36" fill-opacity=".02" stroke="#53665c" stroke-dasharray="6 4" />
<text x="1232" y="264" text-anchor="end" class="eyebrow">AWS / NODE 22 LAMBDA HANDLERS</text>

<!-- Connectors precede nodes. Auth0's token returns to the browser, not to AWS. -->
<path class="edge" d="M112 344V264" />
<path class="edge return" d="M208 264V344" />
<path class="edge" d="M272 380H432" />
<path class="edge" d="M752 356H960" />
<path class="edge" d="M512 408V504" />
<path class="edge" d="M752 548H960" />
<path class="edge" d="M752 608H880Q888 608 888 616V708Q888 716 896 716H960" />
<path class="edge return" d="M600 656V800" />

<!-- Labels live beside their connector, on opaque paper with a visible gap. -->
<rect x="48" y="292" width="54" height="20" fill="#f8f5ec" /><text x="75" y="306" text-anchor="middle" class="edge-label">LOGIN</text>
<rect x="218" y="292" width="112" height="20" fill="#f8f5ec" /><text x="274" y="306" text-anchor="middle" class="edge-label">ACCESS TOKEN</text>
<rect x="280" y="348" width="144" height="24" fill="#f8f5ec" /><text x="352" y="364" text-anchor="middle" class="edge-label">DIRECT FETCH</text>
<rect x="796" y="324" width="156" height="24" fill="#f8f5ec" /><text x="874" y="340" text-anchor="middle" class="edge-label">PUBLIC BYPASS</text>
<rect x="524" y="444" width="116" height="24" fill="#f8f5ec" /><text x="582" y="460" text-anchor="middle" class="edge-label">PROTECTED</text>
<rect x="800" y="516" width="144" height="24" fill="#f8f5ec" /><text x="872" y="532" text-anchor="middle" class="edge-label">JWT VALID</text>
<rect x="760" y="576" width="120" height="24" fill="#f8f5ec" /><text x="820" y="592" text-anchor="middle" class="edge-label">SCOPE VALID</text>
<rect x="612" y="748" width="80" height="24" fill="#f8f5ec" /><text x="652" y="764" text-anchor="middle" class="edge-label">REJECT</text>

<rect class="node" x="48" y="144" width="224" height="120" rx="6" />
<svg x="68" y="160" width="36" height="36" aria-hidden="true" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21.98 7.448L19.62 0H4.347L2.02 7.448c-1.352 4.312.03 9.206 3.815 12.015L12.007 24l6.157-4.552c3.755-2.81 5.182-7.688 3.815-12.015l-6.16 4.58 2.343 7.45-6.157-4.597-6.158 4.58 2.358-7.433-6.188-4.55 7.63-.045L12.008 0l2.356 7.404 7.615.044z"/></svg><text x="120" y="184" class="name">Auth0</text>
<text x="68" y="216" class="tech">aud: https://otters.api</text><text x="68" y="240" class="body">Login → access token</text>

<rect class="node" x="48" y="344" width="224" height="160" rx="6" />
<g transform="translate(68 400)" fill="none" stroke="#183e36" stroke-width="2"><rect x="0" y="0" width="32" height="22" rx="2" /><path d="M-4 28h40M10 22v6m12-6v6" /></g>
<text x="116" y="420" class="name">Browser</text><text x="68" y="452" class="body">Next.js · localhost / Vercel</text><text x="68" y="480" class="tech">SDK: getAccessToken()</text>

<svg x="416" y="240" width="40" height="40" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64"><path fill="#8c4fff" d="M0 0h64v64H0z"/><path fill="#fff" fill-rule="evenodd" d="M28 44h3v-2h-3zm5 0h3v-2h-3zm-5-22h3v-2h-3zm5 0h3v-2h-3zm-11-9.26-10 5.834v27.808l10 5zM24 20h2v2h-2v20h2v2h-2v9a1 1 0 0 1-1.447.895l-12-6A1 1 0 0 1 10 47V18a1 1 0 0 1 .496-.864l12-7A1.002 1.002 0 0 1 24 11zm28-1.426L42 12.74v38.641l10-5zM54 18v29c0 .379-.214.725-.553.895l-12 6a1 1 0 0 1-.972-.044A1 1 0 0 1 40 53v-9h-2v-2h2V22h-2v-2h2v-9a.998.998 0 0 1 1.504-.864l12 7A1 1 0 0 1 54 18m-19.061 9.342-1.878-.684-4 11 1.878.684zm4.768 5.365a1 1 0 0 0 0-1.414l-3-3-1.414 1.414L37.586 32l-2.293 2.293 1.414 1.414zm-12.414 3-3-3a1 1 0 0 1 0-1.414l3-3 1.414 1.414L26.414 32l2.293 2.293z" clip-rule="evenodd"/></svg><text x="472" y="264" class="name">API Gateway HTTP API</text>
<rect class="node" x="432" y="304" width="320" height="104" rx="6" />
<text x="452" y="336" class="name">CORS preflight</text><text x="452" y="364" class="body">Allow the configured web origins</text><text x="452" y="388" class="tech">OPTIONS · no token required</text>
<rect x="432" y="504" width="320" height="152" rx="6" fill="#eeefdf" stroke="#265b47" stroke-width="2" />
<text x="452" y="536" class="name">Auth0 JWT authorizer</text><text x="452" y="564" class="tech">Auth0 JWKS · RS256 signature</text><text x="452" y="588" class="tech">iss: https://AUTH0_DOMAIN/</text><text x="452" y="612" class="tech">aud: https://otters.api</text><text x="452" y="636" class="tech">POST scope: feed:otters</text>

<rect class="node" x="960" y="304" width="272" height="104" rx="6" /><svg x="980" y="320" width="36" height="36" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" fill-rule="evenodd"><path fill="#ed7100" d="M0 0h64v64H0z"/><path fill="#fff" d="M22.68 52h-9.106l10.264-21.59 4.562 9.451zm2.047-24.333a.99.99 0 0 0-.896-.564h-.003a.99.99 0 0 0-.896.569L11.097 52.569c-.147.31-.126.674.057.965.181.29.5.466.842.466H23.31a1 1 0 0 0 .9-.572l6.194-13.144a1 1 0 0 0-.005-.864zM51.008 52h-9.022L26.955 19.578a1 1 0 0 0-.903-.578h-5.924l.007-7h11.68l14.96 32.42c.163.354.516.58.904.58h3.33zm.996-9h-3.69l-14.96-32.42a1 1 0 0 0-.903-.58H19.14a1 1 0 0 0-.996.999l-.008 9A.993.993 0 0 0 19.131 21h6.286l15.03 32.422a1 1 0 0 0 .903.578h10.654c.55 0 .996-.448.996-1v-9c0-.552-.445-1-.996-1"/></g></svg>
<text x="1032" y="340" class="name">Facts · public</text><text x="980" y="380" class="tech">GET /otters/facts</text>
<rect class="node" x="960" y="504" width="272" height="104" rx="6" /><svg x="980" y="520" width="36" height="36" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" fill-rule="evenodd"><path fill="#ed7100" d="M0 0h64v64H0z"/><path fill="#fff" d="M22.68 52h-9.106l10.264-21.59 4.562 9.451zm2.047-24.333a.99.99 0 0 0-.896-.564h-.003a.99.99 0 0 0-.896.569L11.097 52.569c-.147.31-.126.674.057.965.181.29.5.466.842.466H23.31a1 1 0 0 0 .9-.572l6.194-13.144a1 1 0 0 0-.005-.864zM51.008 52h-9.022L26.955 19.578a1 1 0 0 0-.903-.578h-5.924l.007-7h11.68l14.96 32.42c.163.354.516.58.904.58h3.33zm.996-9h-3.69l-14.96-32.42a1 1 0 0 0-.903-.58H19.14a1 1 0 0 0-.996.999l-.008 9A.993.993 0 0 0 19.131 21h6.286l15.03 32.422a1 1 0 0 0 .903.578h10.654c.55 0 .996-.448.996-1v-9c0-.552-.445-1-.996-1"/></g></svg>
<text x="1032" y="540" class="name">Roster · JWT</text><text x="980" y="580" class="tech">GET /otters · caller: sub</text>
<rect class="node" x="960" y="664" width="272" height="104" rx="6" /><svg x="980" y="680" width="36" height="36" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" fill-rule="evenodd"><path fill="#ed7100" d="M0 0h64v64H0z"/><path fill="#fff" d="M22.68 52h-9.106l10.264-21.59 4.562 9.451zm2.047-24.333a.99.99 0 0 0-.896-.564h-.003a.99.99 0 0 0-.896.569L11.097 52.569c-.147.31-.126.674.057.965.181.29.5.466.842.466H23.31a1 1 0 0 0 .9-.572l6.194-13.144a1 1 0 0 0-.005-.864zM51.008 52h-9.022L26.955 19.578a1 1 0 0 0-.903-.578h-5.924l.007-7h11.68l14.96 32.42c.163.354.516.58.904.58h3.33zm.996-9h-3.69l-14.96-32.42a1 1 0 0 0-.903-.58H19.14a1 1 0 0 0-.996.999l-.008 9A.993.993 0 0 0 19.131 21h6.286l15.03 32.422a1 1 0 0 0 .903.578h10.654c.55 0 .996-.448.996-1v-9c0-.552-.445-1-.996-1"/></g></svg>
<text x="1032" y="700" class="name">Snacks · scoped</text><text x="980" y="740" class="tech">POST /otters/{id}/snacks</text>

<rect x="432" y="800" width="320" height="92" rx="6" fill="#f4e5d7" stroke="#d67742" stroke-width="2" />
<text x="452" y="832" class="name">401 / 403 · request stops</text><text x="452" y="860" class="body">No Lambda invocation</text>
<text x="48" y="580" class="body">The browser calls AWS directly.</text><text x="48" y="608" class="body">Next.js manages the Auth0 session;</text><text x="48" y="636" class="body">it does not proxy the otter API.</text>
<text x="808" y="824" class="body">401 · missing, expired or invalid JWT</text><text x="808" y="852" class="body">403 · valid JWT, missing feeding scope</text><text x="808" y="888" class="tech">Response returns to the browser.</text>
<path d="M48 928H1232" stroke="#d9ddcc" />
<text x="48" y="956" class="tech">→ request</text><text x="208" y="956" class="tech">⇢ return / rejection</text><text x="520" y="956" class="tech">CDK provisions API Gateway + Lambda.</text>
<text x="48" y="984" class="eyebrow">CORS CONTROLS BROWSER ACCESS. JWT AUTHORIZATION CONTROLS API ACCESS.</text>
</svg>
